[project]
name = "sts-service"
version = "0.1.0"
description = "Speech-to-Speech dialogue service: streaming STT, TTS, and audio processing"
requires-python = ">=3.12"
dependencies = [
    # --- Audio ---
    "numpy>=1.26",
    "soundfile>=0.12",          # read/write many audio formats (wraps libsndfile)
    "soxr>=0.4",                # high-quality resampling

    # --- VAD ---
    "onnxruntime>=1.17",        # Silero VAD via ONNX (no torch dependency)

    # --- STT ---
    "faster-whisper>=1.0",      # CTranslate2-based Whisper

    # --- TTS ---
    "piper-tts>=1.2",           # Local neural TTS

    # --- Transport ---
    "websockets>=13.0",         # WebSocket server
    "grpcio>=1.62",             # gRPC runtime
    "grpcio-tools>=1.62",       # protoc compiler
    "protobuf>=5.26",

    # --- Session / Config ---
    "pydantic>=2.7",            # config validation & serialisation

    # --- Observability ---
    "structlog>=24.1",          # structured logging
    "prometheus-client>=0.21",  # metrics
    "opentelemetry-api>=1.24",  # distributed tracing
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",

    # --- Async ---
    "uvloop>=0.19 ; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]
gpu = [
    "onnxruntime-gpu>=1.17",    # GPU-accelerated VAD
    # faster-whisper picks up CUDA via ctranslate2 automatically
]

[project.scripts]
sts-service = "sts.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
